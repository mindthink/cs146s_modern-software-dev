<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Week 8 Notes — Flask</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main>
      <p class="badge">Version C · Flask (Python) + SQLite + Vanilla JS</p>
      <h1>Notes</h1>
      <form id="note-form">
        <input id="note-title" placeholder="Title" required maxlength="200" />
        <textarea id="note-content" placeholder="Content" required rows="3"></textarea>
        <button type="submit">Add note</button>
      </form>
      <ul id="notes"></ul>
    </main>
    <script src="/static/app.js"></script>
  </body>
